<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM WL Sistemas</title><style>body{margin:0;font-family:Segoe UI;background:#0b1220;color:#fff}header{background:linear-gradient(90deg,#0f766e,#2563eb);padding:18px}main{padding:20px}.card{background:#111827;padding:16px;border-radius:12px;margin:10px 0}button{background:#14b8a6;color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}input{padding:10px;border-radius:8px;border:0;margin-right:8px}small{color:#94a3b8}</style></head><body><header><h2>CRM WL Sistemas</h2><small>Deploy Vercel • Dados salvos no navegador</small></header><main><div class="card"><input id="empresa" placeholder="Empresa"><button onclick="add()">Adicionar Lead</button></div><div id="lista"></div></main><script>let leads=JSON.parse(localStorage.getItem("wlcrm")||"[]");function save(){localStorage.setItem("wlcrm",JSON.stringify(leads));}function add(){if(!empresa.value)return;leads.push({empresa:empresa.value});empresa.value="";save();render();}function render(){lista.innerHTML="";leads.forEach(l=>{lista.innerHTML+=`<div class='card'><b>${l.empresa}</b></div>`})}render();</script></body></html>
