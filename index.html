<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WL Sistemas CRM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0f172a;
color:white;
}
header{
background:linear-gradient(90deg,#0f766e,#2563eb);
padding:18px;
}
.container{
padding:20px;
}
input,button{
padding:12px;
border-radius:10px;
border:none;
margin:5px;
}
input{
background:#1f2937;
color:white;
}
button{
background:#14b8a6;
color:white;
cursor:pointer;
}
.card{
background:#111827;
padding:15px;
border-radius:12px;
margin:10px 0;
}
</style>

</head>

<body>

<header>

<h1>WL Sistemas CRM</h1>
<p>Conectado ao Supabase</p>

</header>

<div class="container">

<input id="empresa" placeholder="Empresa">
<input id="cidade" placeholder="Cidade">
<button onclick="salvarLead()">Salvar Lead</button>

<div id="lista"></div>

</div>

<script>

const supabase=window.supabase.createClient(
"https://gxfyeiqstfrnimzgkgvw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4ZnllaXFzdGZybmltemdrZ3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjExMzIsImV4cCI6MjEwMzM5NzEzMn0.8rrXM7jenBvoTeL3SQFKAhGYWE92U2Ae40ZMf37aON4"
);

async function carregar(){

const {data,error}=await supabase
.from("leads")
.select("*")
.order("id",{ascending:false});

const lista=document.getElementById("lista");

lista.innerHTML="";

if(error){

lista.innerHTML="Erro ao carregar.";

return;

}

data.forEach(l=>{

lista.innerHTML+=`
<div class="card">

<b>${l.empresa}</b><br>

Cidade: ${l.cidade||"-"}<br>

Etapa: ${l.etapa}

</div>
`;

});

}

async function salvarLead(){

const empresa=document.getElementById("empresa").value;
const cidade=document.getElementById("cidade").value;

if(!empresa)return;

await supabase.from("leads").insert({

empresa,
cidade,
vendedor:"Pablo"

});

empresa.value="";
cidade.value="";

carregar();

}

carregar();

</script>

</body>
</html>
