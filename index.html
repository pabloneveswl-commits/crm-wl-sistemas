<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WL Sistemas CRM</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="login" class="login">

<div class="login-box">

<h1>WL Sistemas</h1>
<p>CRM Enterprise</p>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>

</div>

<div id="app" class="app">

<aside>

<h2>WL CRM</h2>

<nav>

<div>Dashboard</div>
<div>Leads</div>
<div>Agenda</div>
<div>Relatórios</div>

</nav>

</aside>

<main>

<div class="topo">

<h1>Dashboard</h1>

</div>

<div class="cards">

<div class="card">
<h2 id="totalLeads">0</h2>
<p>Leads</p>
</div>

<div class="card">
<h2 id="fechados">0</h2>
<p>Fechados</p>
</div>

<div class="card">
<h2 id="receita">R$0</h2>
<p>Receita</p>
</div>

</div>

<div class="novoLead">

<input id="empresa" placeholder="Nome da empresa">

<button onclick="novoLead()">Novo Lead</button>

</div>

<div id="kanban" class="kanban"></div>

</main>

</div>

<script src="app.js"></script>

</body>
</html>
